services:
  medshield:
    build: .
    ports: ["8000:8000"]
    env_file: [.env]
    environment:
      OLLAMA_BASE_URL: http://ollama:11434/v1
    volumes:
      - medshield-data:/data
      - ./results:/app/results
    depends_on: [ollama]
  ollama:
    image: ollama/ollama
    ports: ["11434:11434"]
    volumes:
      - ollama-models:/root/.ollama
volumes:
  medshield-data:
  ollama-models:
